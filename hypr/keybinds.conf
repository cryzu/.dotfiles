####################
##### KEYBINDS #####
####################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier


##### SYSTEM AND APPLICATIONS #####

# System keybinds
bind = $mainMod, Q, killactive,
# bind = $mainMod SHIFT, ESCAPE, exit # Hyprland managed
bind = $mainMod SHIFT, ESCAPE, exec, uwsm stop # uwsm managed
bind = $mainMod, ESCAPE, exec, $lockscreen
bind = $mainMod, Z, exec, $toggleDiscordMute
bind = $mainMod SHIFT, Z, exec, $toggleDiscordDeafen
bind = $mainMod SHIFT, SPACE, exec, $switchTheme
# bind = $mainMod, ESCAPE, exec, $powerMenu
bind = $mainMod SHIFT, S, exec, $screenshot
bind = $mainMod SHIFT, C, exec, $colorPicker
bind = $mainMod, SPACE, exec, $appMenu

# Application keybinds
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, D, exec, $discord
bind = $mainMod, C, exec, $codeEditor
bind = $mainMod, O, exec, $notes
bind = $mainMod, S, exec, $steam
bind = $mainMod, T, exec, $top
bind = $mainMod, M, exec, $musicPlayer

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, $volumeUp
bindel = ,XF86AudioLowerVolume, exec, $volumeDown
bindel = ,XF86AudioMute, exec, $toggleVolume
bindel = ,XF86AudioMicMute, exec, $toggleMic
bindel = ,XF86MonBrightnessUp, exec, $brightnessUp
bindel = ,XF86MonBrightnessDown, exec, $brightnessDown

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


##### HYPRLAND #####

# Move focus and windows with arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bindd = $mainMod SHIFT, H, Move window left, exec, hyprctl dispatch movewindow l
bindd = $mainMod SHIFT, J, Move window down, exec, hyprctl dispatch movewindow d
bindd = $mainMod SHIFT, K, Move window up, exec, hyprctl dispatch movewindow u
bindd = $mainMod SHIFT, L, Move window right, exec, hyprctl dispatch movewindow r

# Move focus with <>
bindd = $mainMod, COMMA, Cycle to previous window, exec, hyprctl dispatch cyclenext visible
bindd = $mainMod, PERIOD, Cycle to next window, exec, hyprctl dispatch cyclenext visible prev
bindd = $mainMod SHIFT, COMMA, Swap with previous window, exec, hyprctl dispatch swapnext
bindd = $mainMod SHIFT, PERIOD, Swap with next window, exec, hyprctl dispatch swapnext prev

# Additional window controls
bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, BACKSLASH, togglesplit, # dwindle
bind = $mainMod, V, togglefloating,
bind = $mainMod, MINUS, exec, hyprctl dispatch fullscreen 1
bind = $mainMod SHIFT, MINUS, exec, hyprctl dispatch fullscreen 0
bind = $mainMod, SLASH, exec, hyprctl dispatch swapactiveworkspaces eDP-1 HDMI-A-1
bind = $mainMod, EQUAL, exec, $toggleDisplay

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow